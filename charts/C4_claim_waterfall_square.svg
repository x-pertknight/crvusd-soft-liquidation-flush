   <g id="text_17">
    <text style="fill: #6b6b6b; font: 10.5px 'Inter'; text-anchor: end" x="814.735679" y="238.887072" transform="rotate(-0 814.735679 238.887072)">circulating claim 4.10M, definition unknown</text>
