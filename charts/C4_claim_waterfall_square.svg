  <g id="text_18">
   <text style="fill: #1a1a1a; font: 600 19px 'Inter'" transform="translate(34.56 44.721563)">The main measure lands 6 percent below the</text>
   <text style="fill: #1a1a1a; font: 600 19px 'Inter'" transform="translate(34.56 65.976625)">circulating 4.10M figure</text>
  </g>
  <g id="text_19">
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 93.329484)">Net crvUSD sold into the five PegKeeper pools by transactions with a Yield Basis leg,</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 108.880754)">20:00 to 04:00 UTC. Other full-window definitions give 2.69M to 4.59M, so a match does</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 124.432023)">not tell which definition the claim used. Linking by sender alone moves only -0.02M.</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 139.983293)">Most of the V3 change comes from shared router contracts.</text>
  </g>
  <g id="text_20">
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 820.899891)">Source: Ethereum mainnet logs and archive state via public RPC. Window 2026-11-08 20:00 to 2026-11-09 04:00 UTC. No primary source for the claim was</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 832.851113)">found. The pre-registered flush hour (22:30 to 23:30) missed the drop and gives -0.41M. Rules in PREREG_ADDENDUM.md.</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 844.670078)">Data and code: github.com/x-pertknight/crvusd-soft-liquidation-flush</text>
  </g>
