  <g id="text_19">
   <text style="fill: #1a1a1a; font: 600 19px 'Inter'; text-anchor: start" x="34.56" y="36.351562" transform="rotate(-0 34.56 36.351562)">Soft liquidation barely engaged. 50k USD of collateral was converted</text>
  </g>
  <g id="text_20">
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 61.09575)">crvUSD mint markets, 20:00 to 04:00 UTC, 43 trades, all between 22:02 and 23:05, almost all while the EMA oracle was still</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 76.500535)">falling. Loss is measured at that lagging oracle, so its sign is not interpretable. A negative loss means the trades</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 92.051805)">executed above the oracle. 3 hard liquidations, one with 10.8k crvUSD of debt and two dust positions.</text>
  </g>
  <g id="text_21">
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 450.592148)">Source: Ethereum mainnet logs and archive state via public RPC. Window 2026-11-08 20:00 to 2026-11-09 04:00 UTC. Loss = value leaving LLAMMA minus</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 462.411113)">value entering it, both at price_oracle, over soft and de-liquidation trades.</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 474.230078)">Data and code: github.com/x-pertknight/crvusd-soft-liquidation-flush</text>
  </g>
