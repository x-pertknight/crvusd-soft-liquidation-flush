  <g id="text_21">
   <text style="fill: #1a1a1a; font: 600 19px 'Inter'; text-anchor: start" x="34.56" y="36.351562" transform="rotate(-0 34.56 36.351562)">PegKeepers held no crvUSD in their pools when the flush started</text>
  </g>
  <g id="text_22">
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 61.652391)">Debt of each PegKeeper, sampled every 1,800 blocks (about 6 hours) over the 30 days before the window. Only the USDT</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 77.029637)">PegKeeper held debt in that period, and it reached zero by 30 October. In the study window total debt was 0 crvUSD and there</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 92.003465)">were 0 Provide or Withdraw events.</text>
  </g>
  <g id="text_23">
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 450.724406)">Source: Ethereum mainnet logs and archive state via public RPC. Window 2026-11-08 20:00 to 2026-11-09 04:00 UTC. Archive eth_call of PegKeeper debt().</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 462.411113)">The 30 day history is context outside the pre-registered measures. The gray band at the right edge is the 8 hour study window.</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 474.230078)">Data and code: github.com/x-pertknight/crvusd-soft-liquidation-flush</text>
  </g>
