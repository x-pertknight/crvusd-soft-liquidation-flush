  <g id="text_18">
   <text style="fill: #1a1a1a; font: 600 19px 'Inter'; text-anchor: start" x="34.56" y="36.351562" transform="rotate(-0 34.56 36.351562)">The main measure lands 6 percent below the circulating 4.10M figure</text>
  </g>
  <g id="text_19">
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 61.523484)">Net crvUSD sold into the five PegKeeper pools by transactions with a Yield Basis leg, 20:00 to 04:00 UTC. Other full-window</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 77.074754)">definitions give 2.69M to 4.59M, so a match does not tell which definition the claim used. Linking by sender alone moves</text>
   <text style="fill: #6b6b6b; font: 12.5px 'Inter'" transform="translate(34.56 92.626023)">only -0.02M. Most of the V3 change comes from shared router contracts.</text>
  </g>
  <g id="text_20">
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 450.459891)">Source: Ethereum mainnet logs and archive state via public RPC. Window 2026-11-08 20:00 to 2026-11-09 04:00 UTC. No primary source for the claim was</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 462.411113)">found. The pre-registered flush hour (22:30 to 23:30) missed the drop and gives -0.41M. Rules in PREREG_ADDENDUM.md.</text>
   <text style="fill: #6b6b6b; font: 9.5px 'Inter'" transform="translate(34.56 474.230078)">Data and code: github.com/x-pertknight/crvusd-soft-liquidation-flush</text>
  </g>
